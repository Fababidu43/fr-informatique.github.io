<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowos" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="panelos" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowos" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowos" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipos">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-lineos { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinyos { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labelos { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subos { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashos { stroke-dasharray:10 12; animation: dashMoveos 2.1s linear infinite; }
    .pulseos { transform-box: fill-box; transform-origin:center; animation:pulseos 2.4s ease-in-out infinite; }
    .pulse2os { animation-delay:.7s; }
    .pulse3os { animation-delay:1.4s; }

    .floatos { animation:floatos 4.2s ease-in-out infinite; }
    .float2os { animation:floatos 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scanos { animation:scanos 3.4s ease-in-out infinite; }

    .spinos { animation:spinos 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1os { animation:barGrowos 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2os { animation:barGrowos 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3os { animation:barGrowos 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifos { animation:notifPopos 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMoveos { to { stroke-dashoffset:-44; } }
    @keyframes pulseos { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatos { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scanos { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spinos { to { transform:rotate(360deg); } }
    @keyframes barGrowos { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopos { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-lineos" d="M48 70H572"/>
    <path class="grid-lineos" d="M48 135H572"/>
    <path class="grid-lineos" d="M48 200H572"/>
    <path class="grid-lineos" d="M48 265H572"/>
    <path class="grid-lineos" d="M48 330H572"/>
    <path class="grid-lineos" d="M48 395H572"/>
    <path class="grid-lineos" d="M115 45V430"/>
    <path class="grid-lineos" d="M205 45V430"/>
    <path class="grid-lineos" d="M295 45V430"/>
    <path class="grid-lineos" d="M385 45V430"/>
    <path class="grid-lineos" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowos)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulseos"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulseos pulse2os"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulseos pulse3os"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowos)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowos)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashos"/>

  <!-- 01 -->
  <g class="floatos">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulseos"/>
<path d="M90 113h10c0 -5 8 -5 8 0h10v10c5 0 5 8 0 8v10h-10c0 5 -8 5 -8 0h-10v-10c-5 0 -5 -8 0 -8v-10Z"
stroke="#42DDF2" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <text x="105" y="181" text-anchor="middle" class="tinyos">01 · BESOIN NON STANDARD</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#panelos)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipos)">

      <g opacity=".35">
        <path d="M210 190H410M210 215H410M210 240H410M210 265H410" stroke="#3AD9F0" stroke-width="1" stroke-dasharray="2 4"/>
        <path d="M250 170V295M290 170V295M330 170V295M370 170V295" stroke="#3AD9F0" stroke-width="1" stroke-dasharray="2 4"/>
      </g>

      <rect x="222" y="184" width="70" height="8" rx="4" fill="#F3F5FF" opacity=".92"/>

      <rect x="222" y="204" width="60" height="60" rx="10" fill="#202C61" stroke="#3AD9F0" stroke-width="2"/>
      <circle cx="252" cy="234" r="12" stroke="#3AD9F0" stroke-width="2" fill="none"/>
      <path d="M247 234l4 4l7 -8" stroke="#3AD9F0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="292" y="204" width="90" height="26" rx="8" fill="#202C61" stroke="#6B89FF" stroke-width="1.6"/>
      <circle cx="362" cy="217" r="8" fill="#141A44" stroke="#6B89FF" stroke-width="1.6"/>
      <rect x="300" y="212" width="40" height="5" rx="2.5" fill="#AEB9F2"/>

      <rect x="292" y="238" width="90" height="26" rx="13" fill="#141A44" stroke="#8E7CFF" stroke-width="1.6"/>
      <circle cx="360" cy="251" r="9" fill="#8E7CFF"/>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labelos">OUTIL PENSÉ POUR VOUS</text>
    <text x="310" y="365" text-anchor="middle" class="subos">Interface adaptée à votre façon de travailler</text>
  </g>

  <!-- 03 -->
  <g class="float2os">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<circle cx="508" cy="355" r="18" stroke="#8E7CFF" stroke-width="2"/>
<path d="M500 355l6 6l11 -13" stroke="#8E7CFF" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinyos">03 · OUTIL ADOPTÉ</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinyos" fill="#47DFF3">LOGICIEL SUR MESURE</text>
    <text x="16" y="36" class="subos">Vos besoins → conception → outil livré</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1os"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2os"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3os"/>
    </g>
  </g>

</svg>