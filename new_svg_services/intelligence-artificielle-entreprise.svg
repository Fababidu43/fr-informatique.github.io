<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowia" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="panelia" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowia" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowia" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipia">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-lineia { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinyia { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labelia { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subia { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashia { stroke-dasharray:10 12; animation: dashMoveia 2.1s linear infinite; }
    .pulseia { transform-box: fill-box; transform-origin:center; animation:pulseia 2.4s ease-in-out infinite; }
    .pulse2ia { animation-delay:.7s; }
    .pulse3ia { animation-delay:1.4s; }

    .floatia { animation:floatia 4.2s ease-in-out infinite; }
    .float2ia { animation:floatia 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scania { animation:scania 3.4s ease-in-out infinite; }

    .spinia { animation:spinia 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1ia { animation:barGrowia 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2ia { animation:barGrowia 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3ia { animation:barGrowia 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifia { animation:notifPopia 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMoveia { to { stroke-dashoffset:-44; } }
    @keyframes pulseia { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatia { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scania { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spinia { to { transform:rotate(360deg); } }
    @keyframes barGrowia { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopia { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-lineia" d="M48 70H572"/>
    <path class="grid-lineia" d="M48 135H572"/>
    <path class="grid-lineia" d="M48 200H572"/>
    <path class="grid-lineia" d="M48 265H572"/>
    <path class="grid-lineia" d="M48 330H572"/>
    <path class="grid-lineia" d="M48 395H572"/>
    <path class="grid-lineia" d="M115 45V430"/>
    <path class="grid-lineia" d="M205 45V430"/>
    <path class="grid-lineia" d="M295 45V430"/>
    <path class="grid-lineia" d="M385 45V430"/>
    <path class="grid-lineia" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowia)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulseia"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulseia pulse2ia"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulseia pulse3ia"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowia)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowia)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashia"/>

  <!-- 01 -->
  <g class="floatia">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulseia"/>
<path d="M86 114h38a6 6 0 0 1 6 6v14a6 6 0 0 1 -6 6h-20l-9 8v-8h-9a6 6 0 0 1 -6 -6v-14a6 6 0 0 1 6-6Z"
stroke="#42DDF2" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="104" y="131" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#42DDF2">?</text>
    <text x="105" y="181" text-anchor="middle" class="tinyia">01 · TROP D'INFOS À TRAITER</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#panelia)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipia)">

      <g stroke-width="1.6" fill="none" class="dashia">
        <path d="M232 196L292 210" stroke="#7FE8FF"/>
        <path d="M232 232L292 218" stroke="#7FE8FF"/>
        <path d="M232 268L292 238" stroke="#7FE8FF"/>
        <path d="M292 210L352 200" stroke="#B49BFF"/>
        <path d="M292 218L352 232" stroke="#B49BFF"/>
        <path d="M292 238L352 260" stroke="#B49BFF"/>
      </g>

      <circle cx="232" cy="196" r="8" fill="#202C61" stroke="#3AD9F0" stroke-width="1.6" class="pulseia"/>
      <circle cx="232" cy="232" r="8" fill="#202C61" stroke="#3AD9F0" stroke-width="1.6" class="pulseia pulse2ia"/>
      <circle cx="232" cy="268" r="8" fill="#202C61" stroke="#3AD9F0" stroke-width="1.6" class="pulseia pulse3ia"/>

      <circle cx="292" cy="210" r="9" fill="#202C61" stroke="#6B89FF" stroke-width="1.8"/>
      <circle cx="292" cy="218" r="9" fill="#202C61" stroke="#6B89FF" stroke-width="1.8"/>
      <circle cx="292" cy="238" r="9" fill="#202C61" stroke="#6B89FF" stroke-width="1.8"/>

      <circle cx="352" cy="200" r="8" fill="#202C61" stroke="#9A70FF" stroke-width="1.6" class="pulseia"/>
      <circle cx="352" cy="232" r="8" fill="#202C61" stroke="#9A70FF" stroke-width="1.6" class="pulseia pulse2ia"/>
      <circle cx="352" cy="260" r="8" fill="#202C61" stroke="#9A70FF" stroke-width="1.6" class="pulseia pulse3ia"/>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labelia">L'IA TRAVAILLE POUR VOTRE ENTREPRISE</text>
    <text x="310" y="365" text-anchor="middle" class="subia">Réponses, tri et analyse en quelques secondes</text>
  </g>

  <!-- 03 -->
  <g class="float2ia">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<path d="M508 339a14 14 0 0 1 8 25c-1.6 1.3 -2.5 2.6 -2.5 4.5v1h-11v-1c0 -1.9 -0.9 -3.2 -2.5 -4.5a14 14 0 0 1 8 -25Z"
stroke="#8E7CFF" stroke-width="2" fill="none" stroke-linejoin="round"/>
<path d="M504 374h8" stroke="#8E7CFF" stroke-width="2" stroke-linecap="round"/>
<path d="M505 353l3 4l4 -7" stroke="#8E7CFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <text x="508" y="412" text-anchor="middle" class="tinyia">03 · DÉCISIONS ÉCLAIRÉES</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinyia" fill="#47DFF3">IA EN ENTREPRISE</text>
    <text x="16" y="36" class="subia">Données → analyse IA → action utile</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1ia"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2ia"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3ia"/>
    </g>
  </g>

</svg>