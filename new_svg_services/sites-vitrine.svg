<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowsv" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="panelsv" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowsv" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlowsv" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <marker id="arrowsv" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipsv">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-linesv { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinysv { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labelsv { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subsv { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashsv {
      stroke-dasharray:10 12;
      animation: dashMovesv 2.1s linear infinite;
    }
    .pulsesv {
      transform-box: fill-box;
      transform-origin:center;
      animation:pulsesv 2.4s ease-in-out infinite;
    }
    .pulse2sv { animation-delay:.7s; }
    .pulse3sv { animation-delay:1.4s; }

    .floatsv {
      animation:floatsv 4.2s ease-in-out infinite;
    }
    .float2sv {
      animation:floatsv 4.2s ease-in-out infinite;
      animation-delay:-1.4s;
    }

    .scansv {
      animation:scansv 3.4s ease-in-out infinite;
    }

    .cursorsv {
      animation:cursorMovesv 4.6s cubic-bezier(.65,.05,.36,1) infinite;
      transform-origin:center;
    }

    .bar1sv { animation:barGrowsv 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2sv { animation:barGrowsv 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3sv { animation:barGrowsv 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifsv {
      animation:notifPopsv 4.6s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }

    @keyframes dashMovesv {
      to { stroke-dashoffset:-44; }
    }
    @keyframes pulsesv {
      0%,100% { transform:scale(1); opacity:.9; }
      50% { transform:scale(1.12); opacity:1; }
    }
    @keyframes floatsv {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-8px); }
    }
    @keyframes scansv {
      0% { transform:translateY(-70px); opacity:0; }
      15% { opacity:.75; }
      70% { opacity:.25; }
      100% { transform:translateY(170px); opacity:0; }
    }
    @keyframes cursorMovesv {
      0%,12% { transform:translate(0,0); }
      42%,55% { transform:translate(65px,33px); }
      78%,100% { transform:translate(20px,72px); }
    }
    @keyframes barGrowsv {
      0%,100% { transform:scaleX(.55); opacity:.45; }
      50% { transform:scaleX(1); opacity:1; }
    }
    @keyframes notifPopsv {
      0%,48%,100% { transform:scale(.78); opacity:0; }
      55%,84% { transform:scale(1); opacity:1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; }
    }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-linesv" d="M48 70H572"/>
    <path class="grid-linesv" d="M48 135H572"/>
    <path class="grid-linesv" d="M48 200H572"/>
    <path class="grid-linesv" d="M48 265H572"/>
    <path class="grid-linesv" d="M48 330H572"/>
    <path class="grid-linesv" d="M48 395H572"/>
    <path class="grid-linesv" d="M115 45V430"/>
    <path class="grid-linesv" d="M205 45V430"/>
    <path class="grid-linesv" d="M295 45V430"/>
    <path class="grid-linesv" d="M385 45V430"/>
    <path class="grid-linesv" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowsv)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulsesv"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulsesv pulse2sv"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulsesv pulse3sv"/>
  </g>

  <!-- main flowsv -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowsv)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowsv)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashsv"/>

  <!-- 01 Visibility -->
  <g class="floatsv">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulsesv"/>
    <path d="M89 128C94 119 99 115 105 115C111 115 116 119 121 128C116 137 111 141 105 141C99 141 94 137 89 128Z"
          stroke="#42DDF2" stroke-width="2" fill="none"/>
    <circle cx="105" cy="128" r="5" stroke="#42DDF2" stroke-width="2"/>
    <path d="M92 145L118 111" stroke="#42DDF2" stroke-width="2" stroke-linecap="round"/>
    <text x="105" y="181" text-anchor="middle" class="tinysv">01 · VISIBILITÉ</text>
  </g>

  <!-- 02 Website -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#panelsv)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipsv)">
      <rect x="222" y="184" width="95" height="8" rx="4" fill="#F3F5FF" opacity=".92"/>
      <rect x="222" y="201" width="145" height="5" rx="2.5" fill="#6F7CB7" opacity=".7"/>
      <rect x="222" y="213" width="112" height="5" rx="2.5" fill="#6F7CB7" opacity=".5"/>

      <rect x="222" y="235" width="74" height="42" rx="8" fill="#202C61" stroke="#3AD9F0"/>
      <rect x="304" y="235" width="48" height="42" rx="8" fill="#22295E"/>
      <rect x="360" y="235" width="38" height="42" rx="8" fill="#22295E"/>

      <rect x="210" y="170" width="200" height="2" fill="#42DDF2" opacity=".8" class="scansv"/>

      <g class="cursorsv">
        <path d="M280 215L292 246L300 236L311 247L317 241L306 230L317 224L280 215Z"
              fill="#F7F8FF" stroke="#5FE6F7" stroke-width="1"/>
      </g>
    </g>

    <text x="310" y="346" text-anchor="middle" class="labelsv">SITE VITRINE CLAIR &amp; PRO</text>
    <text x="310" y="365" text-anchor="middle" class="subsv">Votre activité comprise en quelques secondes</text>
  </g>

  <!-- 03 contacts -->
  <g class="float2sv">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
    <rect x="489" y="340" width="38" height="26" rx="6" stroke="#71E5F6" stroke-width="2"/>
    <path d="M494 346L508 356L522 346" stroke="#71E5F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="532" cy="337" r="9" fill="#8E7CFF" class="notifsv"/>
    <path d="M528 337H536M532 333V341" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinysv">03 · CONTACTS</text>
  </g>

  <!-- mini performance panelsv -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinysv" fill="#47DFF3">UN PARCOURS SIMPLE</text>
    <text x="16" y="36" class="subsv">Être trouvé → être compris → être contacté</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1sv"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2sv"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3sv"/>
    </g>
  </g>
</svg>