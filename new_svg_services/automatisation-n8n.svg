<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flown8" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="paneln8" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glown8" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrown8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipn8">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-linen8 { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinyn8 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labeln8 { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subn8 { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashn8 { stroke-dasharray:10 12; animation: dashMoven8 2.1s linear infinite; }
    .pulsen8 { transform-box: fill-box; transform-origin:center; animation:pulsen8 2.4s ease-in-out infinite; }
    .pulse2n8 { animation-delay:.7s; }
    .pulse3n8 { animation-delay:1.4s; }

    .floatn8 { animation:floatn8 4.2s ease-in-out infinite; }
    .float2n8 { animation:floatn8 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scann8 { animation:scann8 3.4s ease-in-out infinite; }

    .spinn8 { animation:spinn8 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1n8 { animation:barGrown8 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2n8 { animation:barGrown8 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3n8 { animation:barGrown8 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifn8 { animation:notifPopn8 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMoven8 { to { stroke-dashoffset:-44; } }
    @keyframes pulsen8 { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatn8 { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scann8 { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spinn8 { to { transform:rotate(360deg); } }
    @keyframes barGrown8 { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopn8 { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-linen8" d="M48 70H572"/>
    <path class="grid-linen8" d="M48 135H572"/>
    <path class="grid-linen8" d="M48 200H572"/>
    <path class="grid-linen8" d="M48 265H572"/>
    <path class="grid-linen8" d="M48 330H572"/>
    <path class="grid-linen8" d="M48 395H572"/>
    <path class="grid-linen8" d="M115 45V430"/>
    <path class="grid-linen8" d="M205 45V430"/>
    <path class="grid-linen8" d="M295 45V430"/>
    <path class="grid-linen8" d="M385 45V430"/>
    <path class="grid-linen8" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glown8)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulsen8"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulsen8 pulse2n8"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulsen8 pulse3n8"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flown8)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrown8)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashn8"/>

  <!-- 01 -->
  <g class="floatn8">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulsen8"/>
<path d="M83 122a9 9 0 0 1 9 -9h6" stroke="#42DDF2" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<path d="M98 113v-4" stroke="#42DDF2" stroke-width="2.2" stroke-linecap="round"/>
<path d="M127 134a9 9 0 0 1 -9 9h-6" stroke="#42DDF2" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<path d="M112 143v4" stroke="#42DDF2" stroke-width="2.2" stroke-linecap="round"/>
<path d="M99 122L111 134M111 122L99 134" stroke="#42DDF2" stroke-width="2" stroke-linecap="round"/>
    <text x="105" y="181" text-anchor="middle" class="tinyn8">01 · OUTILS DÉCONNECTÉS</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#paneln8)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipn8)">

      <rect x="222" y="184" width="70" height="8" rx="4" fill="#F3F5FF" opacity=".92"/>
      <rect x="222" y="201" width="150" height="5" rx="2.5" fill="#6F7CB7" opacity=".7"/>

      <circle cx="235" cy="255" r="13" fill="#202C61" stroke="#3AD9F0" stroke-width="2"/>
      <path d="M231 255l3 3l6 -7" stroke="#3AD9F0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M248 255C265 255 262 232 280 232" stroke="#7FE8FF" stroke-width="1.8" fill="none" class="dashn8"/>
      <path d="M248 255C265 255 262 278 280 278" stroke="#7FE8FF" stroke-width="1.8" fill="none" class="dashn8"/>

      <rect x="280" y="222" width="20" height="20" rx="5" transform="rotate(45 290 232)" fill="#202C61" stroke="#6B89FF" stroke-width="2"/>
      <text x="290" y="236" text-anchor="middle" class="tinyn8" fill="#F7F8FF" font-size="9">IF</text>

      <path d="M300 232C320 232 315 218 335 218" stroke="#B49BFF" stroke-width="1.8" fill="none" marker-end="url(#arrown8)"/>
      <path d="M300 232C320 232 315 246 335 246" stroke="#B49BFF" stroke-width="1.8" fill="none" marker-end="url(#arrown8)"/>

      <rect x="335" y="208" width="52" height="20" rx="6" fill="#202C61" stroke="#8E7CFF" stroke-width="2"/>
      <rect x="343" y="215" width="30" height="5" rx="2.5" fill="#B9AEFF"/>

      <rect x="335" y="236" width="52" height="20" rx="6" fill="#202C61" stroke="#42DDF2" stroke-width="2"/>
      <rect x="343" y="243" width="30" height="5" rx="2.5" fill="#8FE9F7"/>

      <path d="M290 242C275 260 275 275 280 278" stroke="#7FE8FF" stroke-width="1.8" fill="none" class="dashn8" opacity="0"/>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labeln8">WORKFLOWS N8N CONNECTÉS</text>
    <text x="310" y="365" text-anchor="middle" class="subn8">Vos applis parlent enfin entre elles</text>
  </g>

  <!-- 03 -->
  <g class="float2n8">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<circle cx="508" cy="355" r="18" stroke="#8E7CFF" stroke-width="2"/>
<path d="M500 355l6 6l11 -13" stroke="#8E7CFF" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinyn8">03 · PROCESS FLUIDE</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinyn8" fill="#47DFF3">AUTOMATISATION N8N</text>
    <text x="16" y="36" class="subn8">Déclencheur → condition → action</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1n8"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2n8"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3n8"/>
    </g>
  </g>

</svg>