<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowdp" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="paneldp" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowdp" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowdp" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipdp">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-linedp { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinydp { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labeldp { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subdp { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashdp { stroke-dasharray:10 12; animation: dashMovedp 2.1s linear infinite; }
    .pulsedp { transform-box: fill-box; transform-origin:center; animation:pulsedp 2.4s ease-in-out infinite; }
    .pulse2dp { animation-delay:.7s; }
    .pulse3dp { animation-delay:1.4s; }

    .floatdp { animation:floatdp 4.2s ease-in-out infinite; }
    .float2dp { animation:floatdp 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scandp { animation:scandp 3.4s ease-in-out infinite; }

    .spindp { animation:spindp 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1dp { animation:barGrowdp 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2dp { animation:barGrowdp 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3dp { animation:barGrowdp 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifdp { animation:notifPopdp 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMovedp { to { stroke-dashoffset:-44; } }
    @keyframes pulsedp { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatdp { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scandp { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spindp { to { transform:rotate(360deg); } }
    @keyframes barGrowdp { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopdp { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-linedp" d="M48 70H572"/>
    <path class="grid-linedp" d="M48 135H572"/>
    <path class="grid-linedp" d="M48 200H572"/>
    <path class="grid-linedp" d="M48 265H572"/>
    <path class="grid-linedp" d="M48 330H572"/>
    <path class="grid-linedp" d="M48 395H572"/>
    <path class="grid-linedp" d="M115 45V430"/>
    <path class="grid-linedp" d="M205 45V430"/>
    <path class="grid-linedp" d="M295 45V430"/>
    <path class="grid-linedp" d="M385 45V430"/>
    <path class="grid-linedp" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowdp)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulsedp"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulsedp pulse2dp"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulsedp pulse3dp"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowdp)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowdp)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashdp"/>

  <!-- 01 -->
  <g class="floatdp">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulsedp"/>
<path d="M105 104L128 150H82L105 104Z" stroke="#42DDF2" stroke-width="2" stroke-linejoin="round" fill="none"/>
<path d="M105 120V134" stroke="#42DDF2" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="105" cy="141" r="1.7" fill="#42DDF2"/>
    <text x="105" y="181" text-anchor="middle" class="tinydp">01 · PANNE / BLOCAGE</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#paneldp)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipdp)">

      <path d="M240 190h130a6 6 0 0 1 6 6v58h-142v-58a6 6 0 0 1 6 -6Z" fill="#141A44" stroke="#33427B" stroke-width="2"/>
      <path d="M224 254h182l-10 14h-162Z" fill="#20275A" stroke="#33427B" stroke-width="2"/>

      <path d="M305 205l14 26h-28l14 -26Z" stroke="#42DDF2" stroke-width="2" fill="none" stroke-linejoin="round" opacity=".85" class="pulsedp"/>
      <path d="M305 216v6" stroke="#42DDF2" stroke-width="2" stroke-linecap="round"/>
      <circle cx="305" cy="227" r="1.4" fill="#42DDF2"/>

      <rect x="210" y="196" width="200" height="2" fill="#8E7CFF" opacity=".8" class="scandp"/>

      <g transform="translate(352 216) rotate(25)">
        <rect x="-6" y="-26" width="12" height="34" rx="4" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
        <circle cx="0" cy="-26" r="9" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
        <circle cx="0" cy="-26" r="3" fill="#8E7CFF"/>
      </g>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labeldp">PROBLÈME DIAGNOSTIQUÉ ET RÉPARÉ</text>
    <text x="310" y="365" text-anchor="middle" class="subdp">Intervention rapide sur site ou à distance</text>
  </g>

  <!-- 03 -->
  <g class="float2dp">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<path d="M492 353h7v18h-7a3 3 0 0 1 -3 -3v-12a3 3 0 0 1 3 -3Z" stroke="#8E7CFF" stroke-width="2" fill="none" stroke-linejoin="round"/>
<path d="M499 353l7 -14c3 0 5 2 5 5v6h9a3.5 3.5 0 0 1 3.4 4.3l-2.6 11a4 4 0 0 1 -3.9 3.1h-11.9" stroke="#8E7CFF" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinydp">03 · ORDINATEUR RÉPARÉ</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinydp" fill="#47DFF3">DÉPANNAGE INFORMATIQUE</text>
    <text x="16" y="36" class="subdp">Panne signalée → diagnostic → réparation</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1dp"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2dp"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3dp"/>
    </g>
  </g>

</svg>