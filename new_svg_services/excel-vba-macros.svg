<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowxl" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="panelxl" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowxl" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowxl" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipxl">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-linexl { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinyxl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labelxl { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subxl { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashxl { stroke-dasharray:10 12; animation: dashMovexl 2.1s linear infinite; }
    .pulsexl { transform-box: fill-box; transform-origin:center; animation:pulsexl 2.4s ease-in-out infinite; }
    .pulse2xl { animation-delay:.7s; }
    .pulse3xl { animation-delay:1.4s; }

    .floatxl { animation:floatxl 4.2s ease-in-out infinite; }
    .float2xl { animation:floatxl 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scanxl { animation:scanxl 3.4s ease-in-out infinite; }

    .spinxl { animation:spinxl 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1xl { animation:barGrowxl 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2xl { animation:barGrowxl 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3xl { animation:barGrowxl 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifxl { animation:notifPopxl 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMovexl { to { stroke-dashoffset:-44; } }
    @keyframes pulsexl { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatxl { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scanxl { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spinxl { to { transform:rotate(360deg); } }
    @keyframes barGrowxl { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopxl { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-linexl" d="M48 70H572"/>
    <path class="grid-linexl" d="M48 135H572"/>
    <path class="grid-linexl" d="M48 200H572"/>
    <path class="grid-linexl" d="M48 265H572"/>
    <path class="grid-linexl" d="M48 330H572"/>
    <path class="grid-linexl" d="M48 395H572"/>
    <path class="grid-linexl" d="M115 45V430"/>
    <path class="grid-linexl" d="M205 45V430"/>
    <path class="grid-linexl" d="M295 45V430"/>
    <path class="grid-linexl" d="M385 45V430"/>
    <path class="grid-linexl" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowxl)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulsexl"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulsexl pulse2xl"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulsexl pulse3xl"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowxl)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowxl)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashxl"/>

  <!-- 01 -->
  <g class="floatxl">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulsexl"/>
<circle cx="105" cy="128" r="14" stroke="#42DDF2" stroke-width="2" fill="#1C285A"/>
<path d="M105 120V128L111 132" stroke="#42DDF2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M118.2 109.2A23 23 0 1 1 86.2 114.8" stroke="#42DDF2" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<path d="M86.2 114.8L85.6 121.3M86.2 114.8L80.3 117.6" stroke="#42DDF2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="181" text-anchor="middle" class="tinyxl">01 · SAISIES RÉPÉTITIVES</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#panelxl)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipxl)">

      <rect x="222" y="182" width="120" height="16" rx="4" fill="#141A44" stroke="#33427B"/>
      <text x="228" y="193" class="tinyxl" fill="#8FE9F7" style="font-size:9px">fx  =SOMME(B2:B9)</text>

      <circle cx="356" cy="190" r="4" fill="#FF6B81" class="pulsexl"/>
      <text x="365" y="193" class="tinyxl" fill="#FF9FAE" style="font-size:8px">REC</text>

      <rect x="222" y="202" width="148" height="76" fill="none" stroke="#33427B"/>
      <g stroke="#33427B" stroke-width="1">
        <path d="M222 221H370M222 240H370M222 259H370"/>
        <path d="M259 202V278M296 202V278M333 202V278"/>
      </g>

      <!-- calculated column sweep -->
      <clipPath id="colClipxl"><rect x="259" y="202" width="37" height="76"/></clipPath>
      <g clip-path="url(#colClipxl)">
        <rect x="259" y="202" width="37" height="18" fill="#3AD9F0" opacity=".22" class="scanxl"/>
      </g>
      <rect x="259" y="202" width="37" height="76" fill="none" stroke="#3AD9F0" stroke-width="1.4" opacity=".7"/>

      <rect x="264" y="245" width="27" height="10" rx="1.5" fill="#202C61" stroke="#42DDF2" stroke-width="1.6"/>

      <rect x="228" y="209" width="26" height="6" rx="1.5" fill="#6F7CB7"/>
      <rect x="228" y="228" width="26" height="6" rx="1.5" fill="#6F7CB7"/>
      <rect x="228" y="247" width="26" height="6" rx="1.5" fill="#6F7CB7"/>
      <rect x="228" y="266" width="26" height="6" rx="1.5" fill="#6F7CB7"/>

      <rect x="301" y="209" width="26" height="6" rx="1.5" fill="#4A5695" opacity=".7"/>
      <rect x="301" y="228" width="26" height="6" rx="1.5" fill="#4A5695" opacity=".7"/>
      <rect x="301" y="247" width="26" height="6" rx="1.5" fill="#4A5695" opacity=".7"/>
      <rect x="301" y="266" width="26" height="6" rx="1.5" fill="#4A5695" opacity=".7"/>

      <!-- auto-generated mini report -->
      <text x="376" y="212" class="tinyxl" fill="#B9AEFF" style="font-size:7px">RAPPORT</text>
      <g transform="translate(378 250)">
        <rect x="0" y="-28" width="7" height="28" rx="2" fill="#324477"/>
        <rect x="0" y="-15" width="7" height="15" rx="2" fill="#42DDF2" class="bar1xl"/>
        <rect x="11" y="-28" width="7" height="28" rx="2" fill="#324477"/>
        <rect x="11" y="-22" width="7" height="22" rx="2" fill="#6B89FF" class="bar2xl"/>
        <rect x="22" y="-28" width="7" height="28" rx="2" fill="#324477"/>
        <rect x="22" y="-9" width="7" height="9" rx="2" fill="#9A70FF" class="bar3xl"/>
      </g>

      <circle cx="392" cy="266" r="13" fill="#1C285A" stroke="#8E7CFF" stroke-width="2" class="notifxl"/>
      <path d="M389 261l8 5l-8 5z" fill="#8E7CFF"/>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labelxl">MACROS QUI TRAVAILLENT POUR VOUS</text>
    <text x="310" y="365" text-anchor="middle" class="subxl">Vos fichiers Excel automatisés et fiabilisés</text>
  </g>

  <!-- 03 -->
  <g class="float2xl">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<circle cx="508" cy="355" r="18" stroke="#8E7CFF" stroke-width="2"/>
<path d="M500 355l6 6l11 -13" stroke="#8E7CFF" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinyxl">03 · HEURES ÉCONOMISÉES</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinyxl" fill="#47DFF3">EXCEL &amp; MACROS VBA</text>
    <text x="16" y="36" class="subxl">Tâche manuelle → macro → résultat en un clic</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1xl"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2xl"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3xl"/>
    </g>
  </g>

</svg>