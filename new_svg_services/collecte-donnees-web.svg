<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowcd" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="panelcd" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowcd" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowcd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipcd">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-linecd { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinycd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labelcd { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subcd { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashcd { stroke-dasharray:10 12; animation: dashMovecd 2.1s linear infinite; }
    .pulsecd { transform-box: fill-box; transform-origin:center; animation:pulsecd 2.4s ease-in-out infinite; }
    .pulse2cd { animation-delay:.7s; }
    .pulse3cd { animation-delay:1.4s; }

    .floatcd { animation:floatcd 4.2s ease-in-out infinite; }
    .float2cd { animation:floatcd 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scancd { animation:scancd 3.4s ease-in-out infinite; }

    .spincd { animation:spincd 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1cd { animation:barGrowcd 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2cd { animation:barGrowcd 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3cd { animation:barGrowcd 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifcd { animation:notifPopcd 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMovecd { to { stroke-dashoffset:-44; } }
    @keyframes pulsecd { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatcd { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scancd { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spincd { to { transform:rotate(360deg); } }
    @keyframes barGrowcd { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopcd { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-linecd" d="M48 70H572"/>
    <path class="grid-linecd" d="M48 135H572"/>
    <path class="grid-linecd" d="M48 200H572"/>
    <path class="grid-linecd" d="M48 265H572"/>
    <path class="grid-linecd" d="M48 330H572"/>
    <path class="grid-linecd" d="M48 395H572"/>
    <path class="grid-linecd" d="M115 45V430"/>
    <path class="grid-linecd" d="M205 45V430"/>
    <path class="grid-linecd" d="M295 45V430"/>
    <path class="grid-linecd" d="M385 45V430"/>
    <path class="grid-linecd" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowcd)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulsecd"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulsecd pulse2cd"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulsecd pulse3cd"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowcd)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowcd)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashcd"/>

  <!-- 01 -->
  <g class="floatcd">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulsecd"/>
<circle cx="102" cy="125" r="14" stroke="#42DDF2" stroke-width="2"/>
<path d="M88 125H116M102 111V139" stroke="#42DDF2" stroke-width="1.3" opacity=".7"/>
<path d="M91 119Q102 123 113 119M91 131Q102 127 113 131" stroke="#42DDF2" stroke-width="1.3" fill="none" opacity=".7"/>
<line x1="111" y1="134" x2="121" y2="144" stroke="#42DDF2" stroke-width="2.4" stroke-linecap="round"/>
    <text x="105" y="181" text-anchor="middle" class="tinycd">01 · RECHERCHE MANUELLE</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#panelcd)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipcd)">

      <circle cx="235" cy="157" r="3" fill="#42DDF2"/>
      <circle cx="246" cy="157" r="3" fill="#6674BC"/>
      <circle cx="257" cy="157" r="3" fill="#8E7CFF"/>

      <rect x="222" y="182" width="165" height="14" rx="4" fill="#1B2354" stroke="#33427B"/>
      <rect x="222" y="204" width="165" height="14" rx="4" fill="#202C61" stroke="#3AD9F0"/>
      <rect x="222" y="226" width="165" height="14" rx="4" fill="#1B2354" stroke="#33427B"/>
      <rect x="228" y="188" width="90" height="4" rx="2" fill="#6F7CB7"/>
      <rect x="228" y="210" width="110" height="4" rx="2" fill="#CFE9FF"/>
      <rect x="228" y="232" width="70" height="4" rx="2" fill="#6F7CB7"/>

      <path d="M310 233C330 233 320 260 350 260" stroke="#7FE8FF" stroke-width="1.8" fill="none" marker-end="url(#arrowcd)" class="dashcd"/>

      <rect x="352" y="248" width="40" height="30" rx="5" stroke="#42DDF2" stroke-width="2" fill="#141A44"/>
      <path d="M352 258h40M368 248v30" stroke="#42DDF2" stroke-width="1.2" opacity=".8"/>

      <rect x="210" y="170" width="200" height="2" fill="#42DDF2" opacity=".8" class="scancd"/>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labelcd">DONNÉES COLLECTÉES POUR VOUS</text>
    <text x="310" y="365" text-anchor="middle" class="subcd">Extraction automatique, propre et fiable</text>
  </g>

  <!-- 03 -->
  <g class="float2cd">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<rect x="491" y="341" width="34" height="24" rx="3" stroke="#8E7CFF" stroke-width="2" fill="none"/>
<path d="M491 350h34M505 341v24" stroke="#8E7CFF" stroke-width="1.4" opacity=".8"/>
<path d="M508 370v9M503 374l5 5l5 -5" stroke="#8E7CFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinycd">03 · DONNÉES PRÊTES</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinycd" fill="#47DFF3">COLLECTE DE DONNÉES WEB</text>
    <text x="16" y="36" class="subcd">Sites ciblés → extraction → export exploitable</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1cd"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2cd"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3cd"/>
    </g>
  </g>

</svg>