<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowat" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="panelat" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowat" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipat">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-lineat { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinyat { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labelat { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subat { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashat { stroke-dasharray:10 12; animation: dashMoveat 2.1s linear infinite; }
    .pulseat { transform-box: fill-box; transform-origin:center; animation:pulseat 2.4s ease-in-out infinite; }
    .pulse2at { animation-delay:.7s; }
    .pulse3at { animation-delay:1.4s; }

    .floatat { animation:floatat 4.2s ease-in-out infinite; }
    .float2at { animation:floatat 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scanat { animation:scanat 3.4s ease-in-out infinite; }

    .spinat { animation:spinat 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1at { animation:barGrowat 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2at { animation:barGrowat 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3at { animation:barGrowat 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifat { animation:notifPopat 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMoveat { to { stroke-dashoffset:-44; } }
    @keyframes pulseat { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scanat { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spinat { to { transform:rotate(360deg); } }
    @keyframes barGrowat { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopat { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-lineat" d="M48 70H572"/>
    <path class="grid-lineat" d="M48 135H572"/>
    <path class="grid-lineat" d="M48 200H572"/>
    <path class="grid-lineat" d="M48 265H572"/>
    <path class="grid-lineat" d="M48 330H572"/>
    <path class="grid-lineat" d="M48 395H572"/>
    <path class="grid-lineat" d="M115 45V430"/>
    <path class="grid-lineat" d="M205 45V430"/>
    <path class="grid-lineat" d="M295 45V430"/>
    <path class="grid-lineat" d="M385 45V430"/>
    <path class="grid-lineat" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowat)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulseat"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulseat pulse2at"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulseat pulse3at"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowat)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowat)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashat"/>

  <!-- 01 -->
  <g class="floatat">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulseat"/>
<circle cx="105" cy="128" r="14" stroke="#42DDF2" stroke-width="2" fill="#1C285A"/>
<path d="M105 120V128L111 132" stroke="#42DDF2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M118.2 109.2A23 23 0 1 1 86.2 114.8" stroke="#42DDF2" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<path d="M86.2 114.8L85.6 121.3M86.2 114.8L80.3 117.6" stroke="#42DDF2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="181" text-anchor="middle" class="tinyat">01 · TÂCHES RÉPÉTITIVES</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#panelat)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipat)">

      <rect x="222" y="184" width="80" height="8" rx="4" fill="#F3F5FF" opacity=".92"/>
      <rect x="222" y="201" width="140" height="5" rx="2.5" fill="#6F7CB7" opacity=".7"/>

      <!-- manual tasks fading out -->
      <g>
        <rect x="222" y="214" width="70" height="14" rx="5" fill="#1B2354" stroke="#33427B" class="pulseat"/>
        <path d="M231 221a5 5 0 1 1 0 .01" stroke="#6F7CB7" stroke-width="1.3" fill="none"/>
        <path d="M231 218v3l2 1.5" stroke="#6F7CB7" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <rect x="242" y="218" width="42" height="4" rx="2" fill="#6F7CB7"/>

        <rect x="222" y="232" width="70" height="14" rx="5" fill="#1B2354" stroke="#33427B" class="pulseat pulse2at"/>
        <path d="M231 239a5 5 0 1 1 0 .01" stroke="#6F7CB7" stroke-width="1.3" fill="none"/>
        <path d="M231 236v3l2 1.5" stroke="#6F7CB7" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <rect x="242" y="236" width="34" height="4" rx="2" fill="#6F7CB7"/>

        <rect x="222" y="250" width="70" height="14" rx="5" fill="#1B2354" stroke="#33427B" class="pulseat pulse3at"/>
        <path d="M231 257a5 5 0 1 1 0 .01" stroke="#6F7CB7" stroke-width="1.3" fill="none"/>
        <path d="M231 254v3l2 1.5" stroke="#6F7CB7" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <rect x="242" y="254" width="40" height="4" rx="2" fill="#6F7CB7"/>
      </g>

      <path d="M296 239H317" stroke="#7FE8FF" stroke-width="1.8" fill="none" marker-end="url(#arrowat)" class="dashat"/>

      <!-- automation engine -->
      <g transform="translate(336 239)">
        <circle r="24" stroke="#42DDF2" stroke-width="1" opacity=".25"/>
        <circle cx="0" cy="-24" r="2.4" fill="#42DDF2" class="spinat"/>
        <circle cx="0" cy="24" r="2" fill="#9A70FF" class="spinat"/>
        <g class="spinat">
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF"/>
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF" transform="rotate(45)"/>
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF" transform="rotate(90)"/>
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF" transform="rotate(135)"/>
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF" transform="rotate(180)"/>
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF" transform="rotate(225)"/>
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF" transform="rotate(270)"/>
          <rect x="-2.4" y="-21" width="4.8" height="8" rx="1.4" fill="#8E7CFF" transform="rotate(315)"/>
        </g>
        <circle r="15" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
        <path d="M-5 0l4 4l7 -8" stroke="#8E7CFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <path d="M361 239H382" stroke="#B49BFF" stroke-width="1.8" fill="none" marker-end="url(#arrowat)" class="dashat"/>

      <!-- automated outputs -->
      <g>
        <rect x="322" y="196" width="65" height="14" rx="5" fill="#202C61" stroke="#3AD9F0" class="notifat"/>
        <circle cx="330" cy="203" r="4" stroke="#3AD9F0" stroke-width="1.6" fill="none"/>
        <path d="M328 203l1.4 1.6l3 -3.2" stroke="#3AD9F0" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <rect x="338" y="200" width="42" height="4" rx="2" fill="#8FE9F7"/>

        <rect x="322" y="255" width="65" height="14" rx="5" fill="#202C61" stroke="#9A70FF" class="notifat" style="animation-delay:.9s"/>
        <circle cx="330" cy="262" r="4" stroke="#9A70FF" stroke-width="1.6" fill="none"/>
        <path d="M328 262l1.4 1.6l3 -3.2" stroke="#9A70FF" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <rect x="338" y="259" width="34" height="4" rx="2" fill="#CBB9FF"/>
      </g>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labelat">WORKFLOWS AUTOMATISÉS</text>
    <text x="310" y="365" text-anchor="middle" class="subat">Les tâches manuelles tournent seules</text>
  </g>

  <!-- 03 -->
  <g class="float2at">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<circle cx="508" cy="355" r="18" stroke="#8E7CFF" stroke-width="2"/>
<path d="M500 355l6 6l11 -13" stroke="#8E7CFF" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinyat">03 · TEMPS LIBÉRÉ</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinyat" fill="#47DFF3">AUTOMATISATION SUR MESURE</text>
    <text x="16" y="36" class="subat">Déclencheur → traitement → résultat livré</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1at"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2at"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3at"/>
    </g>
  </g>

</svg>