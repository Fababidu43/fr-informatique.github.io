<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowai_" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="panelai_" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowai_" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowai_" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipai_">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-lineai_ { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinyai_ { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labelai_ { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subai_ { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashai_ { stroke-dasharray:10 12; animation: dashMoveai_ 2.1s linear infinite; }
    .pulseai_ { transform-box: fill-box; transform-origin:center; animation:pulseai_ 2.4s ease-in-out infinite; }
    .pulse2ai_ { animation-delay:.7s; }
    .pulse3ai_ { animation-delay:1.4s; }

    .floatai_ { animation:floatai_ 4.2s ease-in-out infinite; }
    .float2ai_ { animation:floatai_ 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scanai_ { animation:scanai_ 3.4s ease-in-out infinite; }

    .spinai_ { animation:spinai_ 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1ai_ { animation:barGrowai_ 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2ai_ { animation:barGrowai_ 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3ai_ { animation:barGrowai_ 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifai_ { animation:notifPopai_ 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMoveai_ { to { stroke-dashoffset:-44; } }
    @keyframes pulseai_ { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatai_ { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scanai_ { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spinai_ { to { transform:rotate(360deg); } }
    @keyframes barGrowai_ { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopai_ { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-lineai_" d="M48 70H572"/>
    <path class="grid-lineai_" d="M48 135H572"/>
    <path class="grid-lineai_" d="M48 200H572"/>
    <path class="grid-lineai_" d="M48 265H572"/>
    <path class="grid-lineai_" d="M48 330H572"/>
    <path class="grid-lineai_" d="M48 395H572"/>
    <path class="grid-lineai_" d="M115 45V430"/>
    <path class="grid-lineai_" d="M205 45V430"/>
    <path class="grid-lineai_" d="M295 45V430"/>
    <path class="grid-lineai_" d="M385 45V430"/>
    <path class="grid-lineai_" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowai_)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulseai_"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulseai_ pulse2ai_"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulseai_ pulse3ai_"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowai_)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowai_)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashai_"/>

  <!-- 01 -->
  <g class="floatai_">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulseai_"/>
<path d="M96 112v10M114 112v10" stroke="#42DDF2" stroke-width="2.2" stroke-linecap="round"/>
<path d="M91 122h28v9a14 14 0 0 1 -28 0v-9Z" stroke="#42DDF2" stroke-width="2" fill="none" stroke-linejoin="round"/>
<path d="M105 145v9" stroke="#42DDF2" stroke-width="2.2" stroke-linecap="round"/>
<path d="M99 130l12 10M111 130l-12 10" stroke="#42DDF2" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
    <text x="105" y="181" text-anchor="middle" class="tinyai_">01 · OUTILS ISOLÉS</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#panelai_)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipai_)">

      <circle cx="310" cy="232" r="24" fill="#202C61" stroke="#42DDF2" stroke-width="2"/>
      <text x="310" y="238" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#42DDF2">{ }</text>

      <path d="M290 218L250 196" stroke="#7FE8FF" stroke-width="1.6" class="dashai_"/>
      <path d="M330 218L370 196" stroke="#7FE8FF" stroke-width="1.6" class="dashai_"/>
      <path d="M290 248L250 270" stroke="#B49BFF" stroke-width="1.6" class="dashai_"/>
      <path d="M330 248L370 270" stroke="#B49BFF" stroke-width="1.6" class="dashai_"/>

      <rect x="228" y="180" width="36" height="24" rx="6" fill="#141A44" stroke="#3AD9F0" stroke-width="1.6"/>
      <path d="M238 192h16M238 197h10" stroke="#8FE9F7" stroke-width="1.4" stroke-linecap="round"/>

      <rect x="356" y="180" width="36" height="24" rx="6" fill="#141A44" stroke="#6B89FF" stroke-width="1.6"/>
      <circle cx="374" cy="192" r="6" stroke="#AEB9F2" stroke-width="1.4" fill="none"/>

      <rect x="228" y="258" width="36" height="24" rx="6" fill="#141A44" stroke="#8E7CFF" stroke-width="1.6"/>
      <path d="M234 264l10 8l10 -8" stroke="#CBB9FF" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="356" y="258" width="36" height="24" rx="6" fill="#141A44" stroke="#42DDF2" stroke-width="1.6"/>
      <rect x="363" y="266" width="22" height="4" rx="2" fill="#8FE9F7"/>
      <rect x="363" y="273" width="14" height="4" rx="2" fill="#8FE9F7" opacity=".7"/>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labelai_">SYSTÈMES ENFIN CONNECTÉS</text>
    <text x="310" y="365" text-anchor="middle" class="subai_">Vos logiciels échangent leurs données automatiquement</text>
  </g>

  <!-- 03 -->
  <g class="float2ai_">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<path d="M492 355h10M514 355h10" stroke="#8E7CFF" stroke-width="2.4" stroke-linecap="round"/>
<rect x="502" y="348" width="12" height="14" rx="4" stroke="#8E7CFF" stroke-width="2" fill="#1C285A"/>
<path d="M506 344v4M510 344v4" stroke="#8E7CFF" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="525" cy="342" r="3" fill="#8E7CFF"/>
    <text x="508" y="412" text-anchor="middle" class="tinyai_">03 · TOUT COMMUNIQUE</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinyai_" fill="#47DFF3">API &amp; INTÉGRATIONS</text>
    <text x="16" y="36" class="subai_">Application A → passerelle → application B</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1ai_"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2ai_"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3ai_"/>
    </g>
  </g>

</svg>