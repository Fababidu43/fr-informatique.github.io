<svg width="100%" height="100%" viewBox="0 0 620 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowdb" x1="105" y1="145" x2="510" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9F1"/>
      <stop offset=".55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#9A70FF"/>
    </linearGradient>

    <linearGradient id="paneldb" x1="160" y1="100" x2="460" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20275A"/>
      <stop offset="1" stop-color="#171D4A"/>
    </linearGradient>

    <filter id="glowdb" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.22
                0 0 0 0 0.85
                0 0 0 0 0.95
                0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowdb" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8" stroke="#8E7CFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="screenClipdb">
      <rect x="210" y="170" width="200" height="125" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .grid-linedb { stroke:#2D356B; stroke-width:1; opacity:.55; }
    .tinydb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:.08em; fill:#8E98C9; font-size:11px; }
    .labeldb { font-family: Inter, Arial, sans-serif; fill:#F7F8FF; font-size:14px; font-weight:600; }
    .subdb { font-family: Inter, Arial, sans-serif; fill:#9AA3CF; font-size:11px; }

    .dashdb { stroke-dasharray:10 12; animation: dashMovedb 2.1s linear infinite; }
    .pulsedb { transform-box: fill-box; transform-origin:center; animation:pulsedb 2.4s ease-in-out infinite; }
    .pulse2db { animation-delay:.7s; }
    .pulse3db { animation-delay:1.4s; }

    .floatdb { animation:floatdb 4.2s ease-in-out infinite; }
    .float2db { animation:floatdb 4.2s ease-in-out infinite; animation-delay:-1.4s; }

    .scandb { animation:scandb 3.4s ease-in-out infinite; }

    .spindb { animation:spindb 6s linear infinite; transform-box:fill-box; transform-origin:center; }

    .bar1db { animation:barGrowdb 3.6s ease-in-out infinite; transform-origin:left center; }
    .bar2db { animation:barGrowdb 3.6s ease-in-out infinite .2s; transform-origin:left center; }
    .bar3db { animation:barGrowdb 3.6s ease-in-out infinite .4s; transform-origin:left center; }

    .notifdb { animation:notifPopdb 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

    @keyframes dashMovedb { to { stroke-dashoffset:-44; } }
    @keyframes pulsedb { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.12); opacity:1; } }
    @keyframes floatdb { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes scandb { 0% { transform:translateY(-70px); opacity:0; } 15% { opacity:.75; } 70% { opacity:.25; } 100% { transform:translateY(170px); opacity:0; } }
    @keyframes spindb { to { transform:rotate(360deg); } }
    @keyframes barGrowdb { 0%,100% { transform:scaleX(.55); opacity:.45; } 50% { transform:scaleX(1); opacity:1; } }
    @keyframes notifPopdb { 0%,48%,100% { transform:scale(.78); opacity:0; } 55%,84% { transform:scale(1); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="618" height="498" rx="18" fill="#1A1D4B" stroke="#314078"/>

  <!-- subtle grid -->
  <g opacity=".7">
    <path class="grid-linedb" d="M48 70H572"/>
    <path class="grid-linedb" d="M48 135H572"/>
    <path class="grid-linedb" d="M48 200H572"/>
    <path class="grid-linedb" d="M48 265H572"/>
    <path class="grid-linedb" d="M48 330H572"/>
    <path class="grid-linedb" d="M48 395H572"/>
    <path class="grid-linedb" d="M115 45V430"/>
    <path class="grid-linedb" d="M205 45V430"/>
    <path class="grid-linedb" d="M295 45V430"/>
    <path class="grid-linedb" d="M385 45V430"/>
    <path class="grid-linedb" d="M475 45V430"/>
  </g>

  <!-- ambient particles -->
  <g filter="url(#glowdb)">
    <circle cx="67" cy="374" r="4" fill="#42E4F5" class="pulsedb"/>
    <circle cx="544" cy="92" r="4" fill="#42E4F5" class="pulsedb pulse2db"/>
    <circle cx="526" cy="405" r="3.5" fill="#9A70FF" class="pulsedb pulse3db"/>
  </g>

  <!-- main flow -->
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="url(#flowdb)" stroke-width="2.5" fill="none" opacity=".95" marker-end="url(#arrowdb)"/>
  <path d="M108 130 C170 150 175 225 250 225 C330 225 330 170 405 210 C465 242 445 322 505 352"
        stroke="#7FE8FF" stroke-width="1" fill="none" opacity=".4" class="dashdb"/>

  <!-- 01 -->
  <g class="floatdb">
    <circle cx="105" cy="128" r="41" fill="#1C285A" stroke="#42DDF2" stroke-width="2"/>
    <circle cx="105" cy="128" r="30" stroke="#42DDF2" stroke-width="1" opacity=".18" class="pulsedb"/>
<rect x="89" y="130" width="30" height="20" rx="2.5" transform="rotate(-7 105 128)" stroke="#42DDF2" stroke-width="1.6" fill="#141A44" opacity=".9"/>
<rect x="90" y="122" width="30" height="20" rx="2.5" transform="rotate(4 105 128)" stroke="#42DDF2" stroke-width="1.6" fill="#171D4A" opacity=".95"/>
<rect x="91" y="114" width="30" height="20" rx="2.5" stroke="#42DDF2" stroke-width="2" fill="#1C285A"/>
<path d="M97 120h18M97 125h12" stroke="#42DDF2" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    <text x="105" y="181" text-anchor="middle" class="tinydb">01 · DONNÉES ÉPARPILLÉES</text>
  </g>

  <!-- 02 -->
  <g>
    <rect x="191" y="143" width="238" height="181" rx="16" fill="url(#paneldb)" stroke="#4663AE" stroke-width="1.3"/>
    <rect x="210" y="170" width="200" height="125" rx="10" fill="#10163E" stroke="#384A8B"/>
    <circle cx="224" cy="157" r="3" fill="#42DDF2"/>
    <circle cx="235" cy="157" r="3" fill="#6674BC"/>
    <circle cx="246" cy="157" r="3" fill="#8E7CFF"/>

    <g clip-path="url(#screenClipdb)">

      <rect x="222" y="184" width="70" height="8" rx="4" fill="#F3F5FF" opacity=".92"/>

      <path d="M240 205a30 8 0 1 0 60 0a30 8 0 1 0 -60 0" fill="#202C61" stroke="#42DDF2" stroke-width="2"/>
      <path d="M240 205v34a30 8 0 0 0 60 0v-34" fill="#1B2354" stroke="#42DDF2" stroke-width="2"/>
      <path d="M240 222a30 8 0 0 0 60 0" stroke="#42DDF2" stroke-width="1.4" fill="none" opacity=".8"/>

      <rect x="315" y="196" width="72" height="16" rx="4" fill="#141A44" stroke="#33427B"/>
      <rect x="321" y="201" width="45" height="5" rx="2.5" fill="#6F7CB7"/>
      <rect x="315" y="216" width="72" height="16" rx="4" fill="#141A44" stroke="#33427B"/>
      <rect x="321" y="221" width="55" height="5" rx="2.5" fill="#6F7CB7"/>
      <rect x="315" y="236" width="72" height="16" rx="4" fill="#202C61" stroke="#3AD9F0"/>
      <rect x="321" y="241" width="30" height="5" rx="2.5" fill="#8FE9F7"/>

      <text x="222" y="270" class="tinydb" fill="#8FE9F7" font-size="10">SELECT * FROM clients;</text>

    </g>

    <text x="310" y="346" text-anchor="middle" class="labeldb">BASE DE DONNÉES STRUCTURÉE</text>
    <text x="310" y="365" text-anchor="middle" class="subdb">Vos informations fiables et faciles à interroger</text>
  </g>

  <!-- 03 -->
  <g class="float2db">
    <circle cx="508" cy="355" r="43" fill="#1C285A" stroke="#8E7CFF" stroke-width="2"/>
<circle cx="505" cy="351" r="13" stroke="#8E7CFF" stroke-width="2"/>
<path d="M500 351l4 4l7 -8" stroke="#8E7CFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="514" y1="360" x2="524" y2="371" stroke="#8E7CFF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="508" y="412" text-anchor="middle" class="tinydb">03 · INFO RETROUVÉE</text>
  </g>

  <!-- mini panel -->
  <g transform="translate(54 418)">
    <rect width="512" height="48" rx="9" fill="#12163A" stroke="#33427B"/>
    <text x="16" y="20" class="tinydb" fill="#47DFF3">BASES DE DONNÉES SQL</text>
    <text x="16" y="36" class="subdb">Données brutes → structuration → requêtes rapides</text>

    <g transform="translate(345 14)">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#42DDF2" class="bar1db"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="10" width="70" height="4" rx="2" fill="#6B89FF" class="bar2db"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#324477"/>
      <rect x="0" y="20" width="92" height="4" rx="2" fill="#9A70FF" class="bar3db"/>
    </g>
  </g>

</svg>